# project information
site_name: mrxsierra | Sunil Sharma
site_author: mrxsierra
site_url: https://mrxsierra.github.io/
site_description: "Welcome to my personal website. Here you will find my projects, blogs, and more."

# repository
repo_url: https://github.com/mrxsierra/mrxsierra.github.io
repo_name: mrxsierra/mrxsierra.github.io
edit_uri: edit/main/docs/

# Automated Build Hooks
hooks:
  - hooks/generate_ai_docs.py
  - hooks/generate_rss_feed.py

# copyright
copyright: "© 2025 Sunil Sharma (mrxsierra). All rights reserved."

# docs_dir: "docs"
watch:
  - includes
  - hooks

# Navigation
nav:
  - Welcome: index.md
  - Projects:
      - Overview: projects/index.md
      - GSTN Hackathon: projects/gstn-pbc.md
      - Naukri Web Scraper: projects/naukri-webscraper.md
      - Exam Management System Database: projects/ems-db.md
      - QA Docx to Excel: projects/paraxcel.md
      - Test Management Site: projects/test-site.md
      - Fake Data Generator: projects/s3-faker.md
  - Blog:
      - Articles: blog/index.md
  - About:
      - Profile & Bio: about.md
      - Resume & Credentials: resume.md
      - Press Kit: press/index.md
      - Brand Standards: brand/index.md
      - Release Changelog: changelog.md
  - Contact: contact.md

not_in_nav: |
  test.md
  tags.md
  changelog.md
  llms.txt
  llms-full.txt
  robots.txt
  feed_rss_created.xml
  feed_rss_updated.xml
  feed.xml
  feed_blog.xml
  feed_projects.xml

# exclude
exclude_docs: |
  templates/

draft_docs: |
  drafts/          # Any file inside the "drafts" directory
  _unpublished.md  # Any file ending in "_unpublished.md"
  !/keep_this.md   # Exclude a specific file from being treated as a draft
  test.md
  # blog/

# extra styles and scripts
extra_css:
  - stylesheets/index.css
  - stylesheets/extra.css
  - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css


extra_javascript:
  - javascripts/index.js

# Theme
theme:
  name: material
  custom_dir: overrides
  favicon: assets/img/favicon.ico
  logo: assets/img/logo-monogram.svg
  font:
    text: Inter
    code: JetBrains Mono
  
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.footer
    - navigation.instant.progress
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - header.autohide
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - content.footnote.tooltips
    - content.action.view
  
  icon:
    # admonition:
  #   tag:
  #     home: material/home-roof
  #     html: fontawesome/brands/html5
  #     js: fontawesome/brands/js
  #     css:  fontawesome/brands/css3
  #     python: fontawesome/brands/python
  #     c: fontawesome/solid/c
  #     latest: material/new-releases
  #     blog: material/rss
  #     project: material/developer-board
  
  # Color palettes
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
      # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to light mode

# Plugins 
plugins:
  - blog:
      enabled: true
      blog_dir: blog
      blog_toc: false
  - git-committers:
      enabled: !ENV [CI, false]
      repository: mrxsierra/mrxsierra.github.io
      branch: main
      token: !ENV [MKDOCS_GIT_COMMITTERS_APIKEY, ""]
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      exclude:
          - index.md
  - glightbox:
      auto_caption: true
  - search
  # - social
  - tags
# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.snippets:
      auto_append:
        - includes/abbr.md
  - toc:
      permalink: true


# Extra Settings
extra:
  # Tags mapping
  tags:
    Home: home
    Welcome: home
    HTML5: html
    JavaScript: js
    CSS: css
    Python: python
    C: c
    latest: latest
    blog: blog
    project: project

