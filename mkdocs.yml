      name: YouTube
    - icon: fontawesome/brands/reddit-alien
      link: https://www.reddit.com/user/mrxsierra/
      name: Reddit
    - icon: fontawesome/brands/dev
      link: https://dev.to/mrxsierra
      name: Dev.to
    - icon: fontawesome/brands/medium
      link: https://medium.com/@mrxsierra
      name: Medium
    - icon: fontawesome/brands/python
