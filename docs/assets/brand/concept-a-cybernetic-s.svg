<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="canvasGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="glowA" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#canvasGradA)" stroke="#27272a" stroke-width="2.5" />
  
  <!-- Subtle Internal Grid Accent -->
  <rect x="12" y="12" width="104" height="104" rx="20" fill="none" stroke="#3f3f46" stroke-width="0.75" stroke-dasharray="2 4" opacity="0.4" />

  <!-- Cybernetic Chamfered 'S' Glyph -->
  <!-- Upper Segment -->
  <path d="M 88 32 L 46 32 C 38 32 34 36 34 44 L 34 48 C 34 54 38 58 44 60 L 80 68 C 88 70 94 76 94 84 L 94 88 C 94 96 88 100 80 100 L 40 100" 
        fill="none" 
        stroke="url(#cyberGradA)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glowA)" />

  <!-- Terminal Caret Detail in Bottom Right -->
  <circle cx="88" cy="100" r="3" fill="#38bdf8" />
  <!-- Terminal Node in Top Left -->
  <circle cx="40" cy="32" r="3" fill="#a5b4fc" />
</svg>
