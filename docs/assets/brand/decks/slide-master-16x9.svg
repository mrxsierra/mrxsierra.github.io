<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <!-- 16:9 Presentation Slide Master Template (1920x1080) -->
  <defs>
    <style>
      .sld-bg { fill: #08090d; }
      .sld-border { stroke: #27272a; stroke-width: 1.5; fill: none; }
      .sld-kicker { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; fill: #818cf8; letter-spacing: 2px; }
      .sld-title { font-family: 'Inter', sans-serif; font-size: 64px; font-weight: 900; fill: #ffffff; letter-spacing: -2px; }
      .sld-body { font-family: 'Inter', sans-serif; font-size: 32px; font-weight: 400; fill: #cbd5e1; line-height: 1.6; }
      .sld-footer { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 500; fill: #64748b; }
    </style>
  </defs>

  <rect width="1920" height="1080" class="sld-bg" />
  <rect x="40" y="40" width="1840" height="1000" rx="24" class="sld-border" />

  <!-- Slide Header -->
  <g transform="translate(100, 100)">
    <rect width="56" height="56" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <g transform="scale(0.4375)">
      <path fill="#ffffff" d="
        M 92,30 L 92,48 L 77,48
        C 77,40 71,34 62,34
        C 53,34 47,39 47,46
        C 47,53 53,57 63,60
        L 73,63
        C 88,68 96,75 96,89
        C 96,104 83,114 62,114
        C 42,114 28,103 28,88
        L 28,70 L 43,70
        C 43,79 50,86 62,86
        C 72,86 78,80 78,73
        C 78,66 71,62 61,59
        L 51,56
        C 36,51 29,44 29,31
        C 29,16 43,6 62,6
        C 81,6 92,16 92,30
        Z" />
    </g>
    <text x="76" y="38" class="sld-kicker">KEYNOTE &amp; TECHNICAL PRESENTATION</text>
  </g>

  <!-- Slide Title & Body -->
  <g transform="translate(100, 280)">
    <text x="0" y="0" class="sld-title">Architectural Principles for Scalable Systems</text>
    
    <g transform="translate(0, 120)">
      <text x="0" y="0" class="sld-body">• Deterministic State &amp; Immutable Ledger Models</text>
      <text x="0" y="70" class="sld-body">• Multi-RDBMS Parity Across Postgres, MySQL &amp; SQLite</text>
      <text x="0" y="140" class="sld-body">• Autonomous Agent Workflows with Bounded Tool Execution</text>
      <text x="0" y="210" class="sld-body">• End-to-End Type Safety &amp; Production Verification</text>
    </g>
  </g>

  <!-- Slide Footer -->
  <g transform="translate(100, 960)">
    <line x1="0" y1="0" x2="1720" y2="0" stroke="#27272a" stroke-width="1" />
    <text x="0" y="36" class="sld-footer">Sunil Sharma (@mrxsierra) • mrxsierra.github.io</text>
    <text x="1720" y="36" class="sld-footer" text-anchor="end">CONFIDENTIAL / TECHNICAL SLIDE</text>
  </g>
</svg>
