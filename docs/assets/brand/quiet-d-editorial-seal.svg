  <path class="seal-glyph" d="
    M 78,42 
    C 75,37 68,34 58,34 
    C 46,34 38,41 38,51 
    C 38,60 46,65 58,68 
    L 70,71 
    C 82,74 90,80 90,90 
    C 90,101 80,108 66,108 
    C 53,108 43,102 38,94 
    L 45,87 
    C 49,93 57,98 66,98 
    C 73,98 79,93 79,87 
    C 79,79 71,74 59,71 
    L 48,68 
    C 38,65 30,59 30,49 
    C 30,37 40,26 58,26 
    C 68,26 77,30 84,36 
    Z" />

  <!-- Micro Coordinate Points -->
  <circle cx="64" cy="18" r="1.5" fill="#6366f1" />
  <circle cx="64" cy="110" r="1.5" fill="#6366f1" />
</svg>
