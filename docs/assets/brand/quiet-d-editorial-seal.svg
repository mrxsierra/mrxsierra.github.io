<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Quiet Authority: Direction 4 — Editorial Typographic Seal / Press Crest -->
  <!-- Inspired by Stripe Press & Classical Academic Research Labs -->
  <defs>
    <style>
      .seal-bg { fill: #0d0e12; }
      .seal-ring-outer { stroke: #2a2d36; stroke-width: 1.5px; fill: none; }
      .seal-ring-inner { stroke: #1f222a; stroke-width: 0.75px; stroke-dasharray: 2 3; fill: none; }
      .seal-glyph { fill: #ffffff; }
      .seal-text { font-family: 'Inter', -apple-system, sans-serif; font-size: 7px; font-weight: 700; fill: #94a3b8; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Deep Obsidian Circular Seal -->
  <circle cx="64" cy="64" r="62" class="seal-bg" />
  <circle cx="64" cy="64" r="58" class="seal-ring-outer" />
  <circle cx="64" cy="64" r="50" class="seal-ring-inner" />

