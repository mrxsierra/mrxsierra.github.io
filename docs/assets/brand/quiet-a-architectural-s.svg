<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Quiet Authority: Direction 1 — The Architectural Serif-Sans Monogram -->
  <!-- Pure restrained palette: Deep Obsidian (#0e0f11), Platinum Hairline, Crisp Optical White -->
  <defs>
    <style>
      .canvas-bg { fill: #0e0f11; }
      .border-line { stroke: #23252a; stroke-width: 1.5px; fill: none; }
      .glyph-body { fill: #f8fafc; }
      .accent-subtle { fill: #94a3b8; }
    </style>
  </defs>

  <!-- Clean Precision Canvas with 1px Hairline Frame -->
  <rect width="128" height="128" rx="24" class="canvas-bg" />
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="23.25" class="border-line" />

  <!-- Architectural 'S' Form: Classical Roman Editorial Proportions with Modern Geometric Balance -->
  <path class="glyph-body" d="
    M 84,33 
    C 81,30.5 75,28 66,28 
    C 49,28 38,37.5 38,50 
    C 38,62 48,68 61,72 
    L 69,74.5 
    C 80,78 86,83 86,91 
    C 86,101 75,108 61,108 
    C 49,108 41,103.5 36,97.5 
    L 39.5,88 
    C 45,95 53,98.5 61,98.5 
    C 70,98.5 77,93.5 77,85.5 
    C 77,75.5 69,70.5 56,66.5 
    L 48,64 
    C 37,60.5 30,54 30,44 
    C 30,32 42,22 59,22 
    C 69,22 78,25.5 84,29.5 
    Z" />

  <!-- Refined Optical Apex Serif Terminal Top-Right -->
  <path class="glyph-body" d="M 83,29 L 91,25 L 91,42 L 83,40 Z" />
  <!-- Refined Base Serif Terminal Bottom-Left -->
  <path class="glyph-body" d="M 37,97 L 29,101 L 29,84 L 37,86 Z" />

  <!-- Restrained Minimalist Focal Indicator -->
  <circle cx="64" cy="116" r="1.5" class="accent-subtle" />
</svg>
