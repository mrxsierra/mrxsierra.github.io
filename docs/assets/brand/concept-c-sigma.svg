<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="sigmaGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="bgGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGradC)" stroke="#1e293b" stroke-width="2" />

  <!-- Mathematical Coordinate Grid Background -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
  <line x1="22" y1="64" x2="106" y2="64" stroke="#1e293b" stroke-width="0.75" stroke-dasharray="2 4" opacity="0.4" />
  <line x1="64" y1="22" x2="64" y2="106" stroke="#1e293b" stroke-width="0.75" stroke-dasharray="2 4" opacity="0.4" />

  <!-- Mathematical Sierra Sigma (∑) Glyph -->
  <path d="M 88 32 L 40 32 L 68 64 L 40 96 L 88 96" 
        fill="none" 
        stroke="url(#sigmaGradC)" 
        stroke-width="11" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Precision Vector Vertex Nodes -->
  <circle cx="88" cy="32" r="3.5" fill="#10b981" />
  <circle cx="68" cy="64" r="3.5" fill="#38bdf8" />
  <circle cx="88" cy="96" r="3.5" fill="#6366f1" />
</svg>
