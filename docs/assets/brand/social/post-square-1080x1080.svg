<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="100%" height="100%">
  <!-- Square Social Media Post Card (1080x1080 / 1:1) -->
  <defs>
    <style>
      .sq-bg { fill: #08090d; }
      .sq-border { stroke: #27272a; stroke-width: 2; fill: none; }
      .sq-quote { font-family: 'Inter', sans-serif; font-size: 52px; font-weight: 800; fill: #ffffff; letter-spacing: -1.5px; line-height: 1.3; }
      .sq-author { font-family: 'Inter', sans-serif; font-size: 26px; font-weight: 700; fill: #ffffff; }
      .sq-handle { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 500; fill: #818cf8; }
    </style>
  </defs>

  <rect width="1080" height="1080" class="sq-bg" />
  <rect x="36" y="36" width="1008" height="1008" rx="28" class="sq-border" />

  <!-- Monogram Header -->
  <g transform="translate(80, 80)">
    <rect width="72" height="72" rx="16" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
    <g transform="scale(0.5625)">
      <path fill="#ffffff" d="
        M 92,30 L 92,48 L 77,48
        C 77,40 71,34 62,34
        C 53,34 47,39 47,46
        C 47,53 53,57 63,60
        L 73,63
        C 88,68 96,75 96,89
        C 96,104 83,114 62,114
        C 42,114 28,103 28,88
        L 28,70 L 43,70
        C 43,79 50,86 62,86
        C 72,86 78,80 78,73
        C 78,66 71,62 61,59
        L 51,56
        C 36,51 29,44 29,31
        C 29,16 43,6 62,6
        C 81,6 92,16 92,30
        Z" />
    </g>
  </g>

  <!-- Quote Content -->
  <g transform="translate(80, 360)">
    <text x="0" y="0" class="sq-quote">"Simplicity and structural</text>
    <text x="0" y="70" class="sq-quote">invariants beat clever</text>
    <text x="0" y="140" class="sq-quote">complexity in production</text>
    <text x="0" y="210" class="sq-quote" fill="#818cf8">every single time."</text>
  </g>

  <!-- Author Footer -->
  <g transform="translate(80, 940)">
    <line x1="0" y1="-30" x2="920" y2="-30" stroke="#27272a" stroke-width="1.5" />
    <text x="0" y="10" class="sq-author">Sunil Sharma</text>
    <text x="0" y="40" class="sq-handle">Full-Stack Architect • @mrxsierra</text>
  </g>
</svg>
