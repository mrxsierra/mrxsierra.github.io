<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="100%" height="100%">
  <!-- LinkedIn / Instagram Document Carousel Slide (1080x1350 / 4:5) -->
  <defs>
    <style>
      .cs-bg { fill: #08090d; }
      .cs-border { stroke: #27272a; stroke-width: 2; fill: none; }
      .cs-tag { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; fill: #818cf8; letter-spacing: 2px; }
      .cs-title { font-family: 'Inter', sans-serif; font-size: 64px; font-weight: 900; fill: #ffffff; letter-spacing: -2px; }
      .cs-body { font-family: 'Inter', sans-serif; font-size: 32px; font-weight: 400; fill: #cbd5e1; line-height: 1.5; }
      .cs-page { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600; fill: #64748b; }
    </style>
  </defs>

  <rect width="1080" height="1350" class="cs-bg" />
  <rect x="36" y="36" width="1008" height="1278" rx="28" class="cs-border" />

  <!-- Header: Monogram & Slide Category -->
  <g transform="translate(80, 80)">
    <rect width="64" height="64" rx="14" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
    <g transform="scale(0.5)">
      <path fill="#ffffff" d="
        M 92,30 L 92,48 L 77,48
        C 77,40 71,34 62,34
        C 53,34 47,39 47,46
        C 47,53 53,57 63,60
        L 73,63
        C 88,68 96,75 96,89
        C 96,104 83,114 62,114
        C 42,114 28,103 28,88
        L 28,70 L 43,70
        C 43,79 50,86 62,86
        C 72,86 78,80 78,73
        C 78,66 71,62 61,59
        L 51,56
        C 36,51 29,44 29,31
        C 29,16 43,6 62,6
        C 81,6 92,16 92,30
        Z" />
    </g>
    <text x="88" y="42" class="cs-tag">SYSTEMS ARCHITECTURE</text>
  </g>

  <!-- Slide Content -->
  <g transform="translate(80, 360)">
    <text x="0" y="0" class="cs-title">Database Reliability</text>
    <text x="0" y="80" class="cs-title" fill="#818cf8">At Scale.</text>
    
    <g transform="translate(0, 180)">
      <text x="0" y="0" class="cs-body">1. Schema Migration Invariants</text>
      <text x="0" y="60" class="cs-body">2. Connection Pooling &amp; Backpressure</text>
      <text x="0" y="120" class="cs-body">3. Deterministic Seed Pipelines</text>
      <text x="0" y="180" class="cs-body">4. Automated Chaos Invariant Tests</text>
    </g>
  </g>

  <!-- Footer Pagination & Author -->
  <g transform="translate(80, 1220)">
    <line x1="0" y1="0" x2="920" y2="0" stroke="#27272a" stroke-width="1.5" />
    <text x="0" y="44" class="cs-page">Sunil Sharma (@mrxsierra)</text>
    <text x="920" y="44" class="cs-page" text-anchor="end">01 / 06</text>
  </g>
</svg>
