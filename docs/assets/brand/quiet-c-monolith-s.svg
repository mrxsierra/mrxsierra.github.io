<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Quiet Authority: Direction 3 — Monolithic Precision Monomark -->
  <!-- Two solid architectural elements interlocking with a 3px negative space diagonal -->
  <defs>
    <style>
      .mono-canvas { fill: #0a0b0d; }
      .mono-hairline { stroke: #202227; stroke-width: 1px; fill: none; }
      .mono-element { fill: #f8fafc; }
      .mono-subtle { fill: #64748b; }
    </style>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="128" height="128" rx="26" class="mono-canvas" />
  <rect x="0.5" y="0.5" width="127" height="127" rx="25.5" class="mono-hairline" />

  <!-- Upper Monolith Component -->
  <path class="mono-element" d="
    M 34,26 
    L 86,26 
    C 94,26 98,30 98,38 
    L 98,46 
    C 98,54 92,60 84,62 
    L 58,62 
    C 52,62 48,58 48,52 
    L 48,46 
    L 84,46 
    L 84,38 
    L 34,38 
    Z" />

  <!-- Lower Inverted Monolith Component -->
  <path class="mono-element" d="
    M 94,102 
    L 42,102 
    C 34,102 30,98 30,90 
    L 30,82 
    C 30,74 36,68 44,66 
    L 70,66 
    C 76,66 80,70 80,76 
    L 80,82 
    L 44,82 
    L 44,90 
    L 94,90 
    Z" />

  <!-- Central Precision Shear Guide (Quiet hairline micro-detail) -->
  <circle cx="64" cy="64" r="2" class="mono-subtle" />
</svg>
