<!-- Social Sharing Partial Component -->
<div class="social-share-container" id="social-share-widget">
  <div class="social-share-header">
    <div class="social-share-title">
      <i class="fa-solid fa-share-nodes" aria-hidden="true"></i>
      <span>Share this page</span>
    </div>
    <span class="social-share-subtitle">Found this helpful? Spread the word with your network or subscribe to updates.</span>
  </div>

  <div class="social-share-buttons" role="group" aria-label="Social sharing options">
    <!-- Native Web Share (Visible on supported devices) -->
    <button type="button" class="social-share-btn share-native" id="btn-share-native" title="Share via device menu" aria-label="Share">
      <i class="fa-solid fa-arrow-up-from-bracket" aria-hidden="true"></i>
      <span class="btn-label">Share</span>
    </button>

    <!-- X (Twitter) -->
    <a href="#" class="social-share-btn share-x" id="btn-share-x" target="_blank" rel="noopener noreferrer" title="Share on X (Twitter)" aria-label="Post on X">
      <i class="fa-brands fa-x-twitter" aria-hidden="true"></i>
      <span class="btn-label">Post</span>
    </a>

    <!-- LinkedIn -->
    <a href="#" class="social-share-btn share-linkedin" id="btn-share-linkedin" target="_blank" rel="noopener noreferrer" title="Share on LinkedIn" aria-label="LinkedIn">
      <i class="fa-brands fa-linkedin-in" aria-hidden="true"></i>
      <span class="btn-label">LinkedIn</span>
    </a>

    <!-- Reddit -->
    <a href="#" class="social-share-btn share-reddit" id="btn-share-reddit" target="_blank" rel="noopener noreferrer" title="Share on Reddit" aria-label="Reddit">
      <i class="fa-brands fa-reddit-alien" aria-hidden="true"></i>
      <span class="btn-label">Reddit</span>
    </a>

    <!-- Pinterest -->
    <a href="#" class="social-share-btn share-pinterest" id="btn-share-pinterest" target="_blank" rel="noopener noreferrer" title="Pin on Pinterest" aria-label="Pinterest">
      <i class="fa-brands fa-pinterest" aria-hidden="true"></i>
      <span class="btn-label">Pinterest</span>
    </a>

    <!-- Hacker News -->
    <a href="#" class="social-share-btn share-hn" id="btn-share-hn" target="_blank" rel="noopener noreferrer" title="Submit to Hacker News" aria-label="Hacker News">
      <i class="fa-brands fa-y-combinator" aria-hidden="true"></i>
      <span class="btn-label">Hacker News</span>
    </a>

    <!-- WhatsApp -->
    <a href="#" class="social-share-btn share-whatsapp" id="btn-share-whatsapp" target="_blank" rel="noopener noreferrer" title="Share on WhatsApp" aria-label="WhatsApp">
      <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
      <span class="btn-label">WhatsApp</span>
    </a>

    <!-- Telegram -->
    <a href="#" class="social-share-btn share-telegram" id="btn-share-telegram" target="_blank" rel="noopener noreferrer" title="Share on Telegram" aria-label="Telegram">
      <i class="fa-brands fa-telegram" aria-hidden="true"></i>
      <span class="btn-label">Telegram</span>
    </a>

    <!-- RSS Feed Link -->
    <a href="https://mrxsierra.github.io/feed_rss_created.xml" class="social-share-btn share-rss" id="btn-share-rss" target="_blank" rel="noopener noreferrer" title="Subscribe to RSS Feed" aria-label="RSS Feed">
      <i class="fa-solid fa-rss" aria-hidden="true"></i>
      <span class="btn-label">RSS</span>
    </a>

    <!-- Copy Link -->
    <button type="button" class="social-share-btn share-copy" id="btn-share-copy" title="Copy page link" aria-label="Copy Link">
      <i class="fa-solid fa-link" aria-hidden="true"></i>
      <span class="btn-label" id="copy-btn-text">Copy Link</span>
    </button>
  </div>

  <!-- Toast Notification for Copy -->
  <div class="share-toast" id="share-copy-toast" role="status" aria-live="polite" hidden>
    <i class="fa-solid fa-check" aria-hidden="true"></i>
    <span>Link copied to clipboard!</span>
  </div>
</div>
